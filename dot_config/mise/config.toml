# Global tool versions. A project's own .mise.toml (or .nvmrc / .python-version,
# which mise also reads) overrides these — this is only the fallback for a
# directory that pins nothing.
#
# Every entry is pinned to a major rather than a floating alias. `lts` and
# `latest` both move you to a new major without asking, which turns a rebuild
# six months from now into a different machine. Patch releases within a pinned
# line still come for free. Bump these on purpose.

# Verified 2026-08-30 against endoflife.date:
#
#   node 24    still the active LTS. 26 shipped in May but does not enter LTS
#              until 2026-10-28 — revisit then, not before.
#   python 3.13  3.14 has been out since 2025-10 and is no longer new, so the
#              "packages have not caught up" argument is close to expired.
#              Left pinned deliberately; bump when a project actually needs it.
#   go 1.27    released 2026-08-19. Go supports the two most recent releases,
#              so 1.26 was still in support — this is a routine bump, not a fix.
[tools]
node = "24"
python = "3.13"
go = "1.27"

[settings]
# Experimental features stay off; nothing here depends on one.
experimental = false
